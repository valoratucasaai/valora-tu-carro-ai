# Plan free de Render: sin disco persistente (el disco solo existe en planes pagos).
# Los datos viven en Neon (Postgres), configurado con DATABASE_URL.
services:
  - type: web
    name: valora-tu-carro-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: BOLD_IDENTITY_KEY
        sync: false
      - key: BOLD_SECRET_KEY
        sync: false
      - key: BOLD_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_URL
        sync: false
      # Cadena de conexión de Neon. SIN ella los datos se pierden en cada redespliegue.
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
